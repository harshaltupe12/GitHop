[package]
name = "githop-cli"
description = "GitHop command-line tool and hook entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "githop"
path = "src/main.rs"

[dependencies]
githop-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rpassword.workspace = true
zeroize.workspace = true
# Already in the tree via clap (anstream). Used only to switch on Windows console
# virtual-terminal processing so ANSI colours render — no new crates, no unsafe here.
anstyle-query = "1"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
insta = "1"

[lints]
workspace = true
