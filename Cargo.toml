[workspace]
resolver = "2"
members = ["crates/*"]
# app/src-tauri is added in Phase 5.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0" # open item (Phase 0 §4.7) — confirm before release
publish = false

[workspace.dependencies]
githop-core = { path = "crates/githop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1"
tempfile = "3"
fd-lock = "4"
time = { version = "0.3", features = ["formatting", "macros"] }
sha2 = "0.10"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
