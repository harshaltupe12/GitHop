[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0" # open item (Phase 0 §4.7) — confirm before release
publish = false

[workspace.dependencies]
githop-core = { path = "crates/githop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1"
tempfile = "3"
fd-lock = "4"
time = { version = "0.3", features = ["formatting", "macros"] }
sha2 = "0.10"
assert_cmd = "2"
predicates = "3"
# Export/import (Phase 6 §3): passphrase (scrypt) encryption only — no ssh/plugin/cli features.
age = { version = "0.11", default-features = false }
base64 = "0.21" # same version age uses (no duplicate)
zeroize = "1"
# Hidden password prompt for `githop export/import` (console only, no network).
rpassword = "7"
# In-app SSH key creation and unlock (ed25519, bcrypt-pbkdf + aes256-ctr, OpenSSH format).
# Local crypto only: no network features.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Export/import: scrypt (age passphrase mode) is ~50x slower unoptimised, which
# makes debug builds and tests take minutes per export. Optimise just the crypto.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
