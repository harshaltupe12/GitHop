# cargo-deny configuration for GitHop.
#
# GitHop is local-only: it must never make a network request (Plan §10).
# The [bans] list below makes any HTTP/WebSocket client crate a hard failure.
#
# NOTE (Phase 5): when Tauri is added, re-run `cargo deny check` and investigate
# any banned crate pulled in transitively. Do NOT just remove it from this list —
# find the feature flag that pulls it in and turn it off.

[graph]
all-features = false
# Only the platforms GitHop is built for (Windows) plus Linux, where CI runs the
# core/CLI tests. Without this, cargo-deny also walks Tauri's Android/iOS-only
# dependency on `reqwest` (tauri's Cargo.toml: `[target.'cfg(any(target_os =
# "android", all(target_vendor = "apple", not(target_os = "macos"))))'
# .dependencies.reqwest]`), which can never be compiled into a Windows build.
# Check: `cargo tree -p githop-app --target x86_64-pc-windows-msvc -i reqwest`
# prints nothing. The [bans] list itself is unchanged and still applies in full
# to every target listed here.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    # Boost Software License 1.0 — permissive, OSI approved. clipboard-win and
    # error-code (via arboard ← tauri-plugin-clipboard-manager, Windows clipboard).
    "BSL-1.0",
    # Public-domain dedication — permissive. notify (file watcher for profiles.toml).
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "ureq" },
    { name = "ureq-proto" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "minreq" },
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    { name = "async-tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
