[package]
name = "githop-app"
description = "GitHop tray app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "GitHop"

[lib]
name = "githop_app"
path = "src/lib.rs"

[[bin]]
name = "GitHop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
githop-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Local-only: no http/updater/websocket/upload/shell plugins (Phase 5 §3.1, CLAUDE.md rule 1).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
# Watches profiles.toml / settings.toml so CLI edits refresh the UI and tray.
notify = { version = "8", default-features = false }
notify-debouncer-mini = { version = "0.7", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
